<!doctype html>
<!--
  Dexi control page, served at "/".
  Edit this file, then `make build` regenerates control_html.h (tools/embed_web.py).
  Talks to the API in src/net/web_api.cpp.
-->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dexi</title>
  <style>
    :root {
      --bg: #0e1116;
      --card: #171c24;
      --key: #242b36;
      --fg: #eef1f6;
      --dim: #8a93a3;
      --acc: #ff6eb4;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.3 system-ui, -apple-system, sans-serif;
      padding: max(14px, env(safe-area-inset-top)) 14px 14px;
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    #status {
      color: var(--dim);
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 12px;
    }

    .label {
      color: var(--dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }

    button,
    input {
      font: inherit;
      color: inherit;
      border: 0;
      border-radius: 12px;
      background: var(--key);
      min-height: 44px;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(.96);
    }

    button.sel {
      background: var(--acc);
      color: #2a0016;
    }

    .moods {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .say {
      display: flex;
      gap: 6px;
    }

    .say input {
      flex: 1;
      padding: 0 12px;
      min-width: 0;
    }

    .say button {
      padding: 0 16px;
      background: var(--acc);
      color: #2a0016;
    }

    .lights {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .lights button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 2px;
      font-size: 13px;
    }

    .lights button i {
      font-style: normal;
      font-size: 20px;
    }

    .hint {
      color: var(--dim);
      font-size: 13px;
      margin: 10px 2px 0;
      min-height: 1.2em;
    }

    .ctl {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--dim);
    }

    .ctl span {
      width: 76px;
      flex: none;
    }

    .ctl input[type=range] {
      flex: 1;
      accent-color: var(--acc);
    }

    .ctl b {
      width: 40px;
      text-align: right;
      color: var(--fg);
      font-weight: 500;
    }

    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      flex: 1;
    }

    .swatches button,
    #color {
      width: 28px;
      height: 28px;
      min-height: 0;
      padding: 0;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    .swatches button.sel {
      border-color: var(--fg);
    }

    #color {
      background: none;
      border: 2px dashed var(--dim);
      flex: none;
    }

    #pad {
      height: 120px;
      border-radius: 12px;
      background: var(--key);
      position: relative;
      touch-action: none;
    }

    #pad span {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--dim);
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Dexi</h1><span id="status">connecting…</span>
    </header>
    <section class="card">
      <div class="label">Monitor lights</div>
      <div class="lights" id="light"></div>
      <div class="hint" id="lightHint"></div>
      <div class="ctl" id="colorRow">
        <span>Colour</span>
        <div class="swatches" id="swatches"></div>
        <input id="color" type="color" aria-label="Custom colour">
      </div>
      <div class="ctl" id="briRow">
        <span>Brightness</span>
        <input id="bri" type="range" min="10" max="255" aria-label="Brightness">
        <b id="briPct"></b>
      </div>
    </section>
    <section class="card">
      <div class="label">Mood</div>
      <div class="moods" id="moods"></div>
    </section>
    <section class="card">
      <div class="label">Say</div>
      <form class="say" id="sayForm">
        <input id="text" maxlength="76" placeholder="Something for Dexi to say" autocomplete="off">
        <button>Say</button>
      </form>
    </section>
    <section class="card">
      <div class="label">Look</div>
      <div id="pad"><span>tap or drag to move Dexi's eyes</span></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const MOODS = ['neutral', 'happy', 'excited', 'love', 'sleepy', 'sad',
      'angry', 'surprised', 'hot', 'cold', 'curious'];
    // One choice for the strip. "screen" = follow the monitor (HyperHDR); an effect
    // turns screen sync off so it shows straight away; off = everything dark.
    const LIGHTS = [
      { v: 'screen', icon: '🖥', label: 'Screen' }, { v: 'mood', icon: '💗', label: 'Mood' },
      { v: 'rainbow', icon: '🌈', label: 'Rainbow' }, { v: 'candle', icon: '🕯', label: 'Candle' },
      { v: 'solid', icon: '🟠', label: 'Solid' }, { v: 'chase', icon: '☄️', label: 'Chase' },
      { v: 'sparkle', icon: '✨', label: 'Sparkle' }, { v: 'off', icon: '⏻', label: 'Off' },
    ];
    const USES_COLOR = ['solid', 'chase', 'sparkle'];
    const SWATCHES = ['ff6a00', 'ff0000', 'ff00aa', '7a00ff', '0066ff', '00ccff', '00ff66', 'ffffff'];
    const HINTS = {
      screen: (l) => l.syncing ? 'Following the monitor live.' : 'Waiting for HyperHDR on the Mac; showing Dexi\'s mood meanwhile. Stuck? make lights DO=restart',
      mood: () => 'Glows in Dexi\'s colour and breathes; dims when Dexi sleeps.',
      rainbow: () => 'A slow flowing rainbow.',
      candle: () => 'Warm flickering firelight.',
      solid: () => 'One steady colour.',
      chase: () => 'A comet running round the monitor.',
      sparkle: () => 'Random twinkles.',
      off: () => 'Strip is off.',
    };
    let lightBusy = false;
    let state = {};

    async function call(path) {
      const res = await fetch(path).catch(() => null);
      if (res && res.ok) render(await res.json());
      else $('status').textContent = 'offline';
    }

    function render(s) {
      state = s;
      $('status').textContent = s.mood + (s.say ? ' · "' + s.say + '"' : '') + ' · pets ' + (s.taps + s.long_presses);
      $('moods').replaceChildren(...MOODS.map((m) => {
        const b = document.createElement('button');
        b.textContent = m;
        b.className = m === s.base ? 'sel' : '';
        b.onclick = () => call('/mood?m=' + m);
        return b;
      }));
      renderLights(s.light || {});
    }

    function lightChoice(l) {
      if (l.mode === 'off') return 'off';
      return l.sync ? 'screen' : l.mode;
    }

    function renderLights(l) {
      const cur = lightChoice(l);
      $('light').replaceChildren(...LIGHTS.map((o) => {
        const b = document.createElement('button');
        b.innerHTML = `<i>${o.icon}</i>${o.label}`;
        b.className = o.v === cur ? 'sel' : '';
        b.onclick = () => setLight(o.v === 'screen' ? 'sync=on&mode=mood' : 'sync=off&mode=' + o.v);
        return b;
      }));
      $('lightHint').textContent = (HINTS[cur] || (() => ''))(l);
      $('colorRow').style.display = USES_COLOR.includes(cur) ? '' : 'none';
      $('briRow').style.display = cur === 'off' || cur === 'screen' ? 'none' : '';
      $('swatches').replaceChildren(...SWATCHES.map((c) => {
        const b = document.createElement('button');
        b.style.background = '#' + c;
        b.className = c === l.color ? 'sel' : '';
        b.setAttribute('aria-label', '#' + c);
        b.onclick = () => setLight('color=' + c);
        return b;
      }));
      if (document.activeElement !== $('color') && l.color) $('color').value = '#' + l.color;
      if (document.activeElement !== $('bri')) $('bri').value = l.bri ?? 160;
      $('briPct').textContent = Math.round($('bri').value / 2.55) + '%';
    }

    async function setLight(q) {
      if (lightBusy) return;
      lightBusy = true;
      const res = await fetch('/light?' + q).catch(() => null);
      lightBusy = false;
      if (res && res.ok) renderLights(state.light = await res.json());
    }

    $('color').onchange = () => setLight('color=' + $('color').value.slice(1));
    $('bri').oninput = () => { $('briPct').textContent = Math.round($('bri').value / 2.55) + '%'; };
    $('bri').onchange = () => setLight('bri=' + $('bri').value);

    $('sayForm').onsubmit = (e) => {
      e.preventDefault();
      const text = $('text').value.trim();
      if (text) call('/say?text=' + encodeURIComponent(text) + '&secs=10');
      $('text').value = '';
    };

    let lastLook = 0;
    function look(e) {
      const r = $('pad').getBoundingClientRect();
      const x = ((e.clientX - r.left) / r.width) * 2 - 1;
      const y = ((e.clientY - r.top) / r.height) * 2 - 1;
      if (Date.now() - lastLook < 120) return;  // don't flood the ESP32
      lastLook = Date.now();
      fetch(`/look?x=${x.toFixed(2)}&y=${y.toFixed(2)}&secs=4`).catch(() => {});
    }
    $('pad').onpointerdown = (e) => { $('pad').setPointerCapture(e.pointerId); look(e); };
    $('pad').onpointermove = (e) => { if (e.buttons) look(e); };

    call('/state');
    setInterval(() => call('/state'), 3000);
  </script>
</body>

</html>
